name: CI
on:  # yamllint disable-line rule:truthy
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        emacs-version:
          - '26.3'
          - '27.1'
          - '28.1'
          - '29.1'
          - '29.4'
          - '30.1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: jamescherti/setup-emacs@master
        with:
          version: ${{ matrix.emacs-version }}

      - uses: actions/cache@v4
        id: cache-cask-packages
        with:
          path: |
            .cask
            ~/.emacs.d/.cask
          key: cache-cask-packages-${{ runner.os }}-${{ matrix.emacs-version }}-${{ hashFiles('Cask', '*.el') }}

      - uses: actions/cache@v4
        id: cache-cask-executable
        with:
          path: ~/.cask
          key: cache-cask-executable-${{ runner.os }}

      - uses: jamescherti/setup-cask@master
        if: steps.cache-cask-executable.outputs.cache-hit != 'true'
        with:
          version: snapshot

      - name: Add Cask to PATH
        run: echo "$HOME/.cask/bin" >> "$GITHUB_PATH"

      - name: Compile
        run: make compile

      - name: Package-lint
        run: make package-lint

      - name: Unit-tests
        run: make test

      - name: Run melpazoid
        if: matrix.emacs-version == '30.1'
        env:
          LOCAL_REPO: "${{ github.workspace }}"
          RECIPE: (easysession :fetcher github :repo "jamescherti/easysession.el" :branch "${{ github.ref_name }}")
          EXIST_OK: 'false'
        run: |
          python -m pip install --upgrade pip
          git clone https://github.com/riscy/melpazoid.git ~/melpazoid
          pip install ~/melpazoid
          cat ~/melpazoid/melpazoid/melpazoid.el
          echo "$GITHUB_REF" && make -C ~/melpazoid
